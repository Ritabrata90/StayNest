services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  mongo-data:
